name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed --name EmberTournament --icon icon.ico --add-data "data;data" --collect-all pygame main.py

      - name: Create standalone ZIP package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/EmberTournament/*" -DestinationPath "dist/EmberTournament-Windows-x64.zip" -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EmberTournament-Windows-x64
          path: |
            dist/EmberTournament-Windows-x64.zip
            dist/EmberTournament/EmberTournament.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Ember Tournament - Windows Release (Latest Build)' }}
          files: |
            dist/EmberTournament-Windows-x64.zip
            dist/EmberTournament/EmberTournament.exe
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Ember Tournament - Official Windows Release

            ### Download Options
            * **`EmberTournament-Windows-x64.zip` (Recommended)**: Complete standalone package with the executable and bundled assets. Unzip and run `EmberTournament.exe` immediately without installing Python or any extra tools.
            * **`EmberTournament.exe`**: Standalone Windows binary with built-in asset auto-recovery.

            ---

            ### System Requirements
            * **OS**: Windows 10 or Windows 11 (64-bit)
            * **RAM**: 4 GB or higher
            * **Graphics**: OpenGL 3.3 / DirectX 11 compatible GPU (hardware scaling supported)
            * **Storage**: 350 MB free drive space
            * **Input**: Keyboard or Gamepad (PS5 DualSense, PS4, Xbox Series/One, DirectInput controllers supported)

            ---

            ### Quick Start
            1. Download **`EmberTournament-Windows-x64.zip`** below.
            2. Extract the archive into any folder on your computer.
            3. Double-click **`EmberTournament.exe`** to launch the game.
            4. *(Optional)* Plug in your controller — it is auto-detected with custom haptic vibration feedback.

            ---

            ### Controls
            * **Player 1**: `W/A/S/D` to move, `F` (Light), `G` (Heavy), `H` (Kick), `T` (Fireball), `Y` (Super Move).
            * **Player 2**: Arrow keys to move, `J` (Light), `K` (Heavy), `L` (Kick), `I` (Fireball), `O` (Super Move).
            * **Gamepad**: Left Stick / D-Pad to move, Face buttons for attacks, Bumpers/Triggers for Dash & Super.
            * **Toggle Fullscreen**: `F11` | **Pause / Back**: `Esc`
