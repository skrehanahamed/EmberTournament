name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed --name EmberTournament --icon icon.ico --add-data "data;data" --collect-all pygame main.py

      - name: Create standalone ZIP package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/EmberTournament/*" -DestinationPath "dist/EmberTournament-Windows-x64.zip" -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EmberTournament-Windows-x64
          path: dist/EmberTournament-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EmberTournament-Windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
